<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="clientes"><li>Clientes</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Clientes</h2>
        <form class="formulario" th:action="@{/saveCliente}" method="post">
            <input type="text" id="dpi" name="dpi" placeholder="DPI" required>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" name="apellido" placeholder="Apellido" required>
            <input type="text" id="direccion" name="direccion" placeholder="Dirección" required>
            
            <select id="estado" name="estado" required>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <div class="botones">
                <button type="submit">Agregar</button>
            </div>
        </form>

        <form class="search" th:action="@{/buscarCliente}" method="post">
            <input type="number" id="id" name="id" placeholder="Buscar por código" required>
            <button type="submit" class="btn-search" id="btn-buscar">
                <i class="bi bi-search"></i>
            </button>
        </form>

        <button class="btn-limpiar" onclick="limpiarCampos()">Limpiar </button>

        <table>
            <thead>
                <tr>
                    <th>DPI</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Dirección</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaClientes"></tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.dpi_cliente}"></td>
                <td th:text="${c.nombre_cliente}"></td>
                <td th:text="${c.apellido_cliente}"></td>
                <td th:text="${c.direccion}"></td>
                <td th:text="${c.estado}"></td>
                <td>
                    <a th:href="@{'/deleteClientes/' + ${c.dpi_cliente}}" onclick="return confirm('¿Estás seguro de que deseas eliminar este cliente?');">
                        <button class="btn-delete">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>
                    <button class="btn-edit"
                            th:data-dpi="${c.dpi_cliente}"
                            th:data-nombre="${c.nombre_cliente}"
                            th:data-apellido="${c.apellido_cliente}"
                            th:data-direccion="${c.direccion}"
                            th:data-estado="${c.estado}"
                            onclick="abrirModalDesdeBoton(this)">
                        <i class="bi bi-pencil"></i>
                    </button>
                </td>
            </tr>
        </table>
        <div id="modalEditar" class="modal">
            <div class="modal-content">
                <h3>Editar Producto</h3>

                <form th:action="@{/updateCliente}" method="post">
                    <input type="hidden" id="editDpi" name="dpi">
                    <input type="text" id="editNombre" name="nombre">
                    <input type="text" id="editApellido" name="apellido">
                    <input type="text" id="editDireccion" name="direccion">

                    <select id="editEstado" name="estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>

                    <button type="submit">Guardar</button>
                    <button type="button" onclick="cerrarModal()">Cancelar</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function cerrarModal() {
            document.getElementById("modalEditar").style.display = "none";
        }

        function abrirModalDesdeBoton(btn) {
            const dpi = btn.getAttribute("data-dpi");
            const nombre = btn.getAttribute("data-nombre");
            const apellido = btn.getAttribute("data-apellido");
            const direccion = btn.getAttribute("data-direccion");
            const estado = btn.getAttribute("data-estado");

            document.getElementById("modalEditar").style.display = "block";

            document.getElementById("editDpi").value = dpi;
            document.getElementById("editNombre").value = nombre;
            document.getElementById("editApellido").value = apellido;
            document.getElementById("editDireccion").value = direccion;
            document.getElementById("editEstado").value = (estado == 1) ? "Activo" : "Inactivo";
        }
    </script>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Detalles de Venta</title>
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Detalles de Venta</h2>
        <div class="formulario">
            <input type="text" id="codigoDetalle" placeholder="Código Detalle">
            <input type="text" id="cantidad" placeholder="Cantidad">
            <input type="text" id="precio" placeholder="Precio">
            <input type="text" id="subtotal" placeholder="Subtotal">
            <input type="text" id="codigoProducto" placeholder="Código Producto">
            <input type="text" id="codigoVenta" placeholder="Código Venta">
            

            <div class="botones">
                <button>Agregar</button>
                <button>Buscar</button>
                <button>Eliminar</button>
                <button>Limpiar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código Detalle</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Código Producto</th>
                    <th>Código Venta</th>
                </tr>
            </thead>
            <tbody id="tablaDetalles"></tbody>
        </table>

    </div>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang='en' xmlns:th="htttp://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Detalles de Venta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Detalles de Venta</h2>
        <div class="formulario">
            <input type="text" id="codigoDetalle" placeholder="Código Detalle">
            <input type="text" id="cantidad" placeholder="Cantidad">
            <input type="text" id="precio" placeholder="Precio">
            <input type="text" id="subtotal" placeholder="Subtotal">
            <input type="text" id="codigoProducto" placeholder="Código Producto">
            <input type="text" id="codigoVenta" placeholder="Código Venta">
            

            <div class="botones">
                <button>Agregar</button>
                <button>Buscar</button>
                <button>Eliminar</button>
                <button>Limpiar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código Detalle</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Código Producto</th>
                    <th>Código Venta</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaDetalles"></tbody>
            <tr th:each="d : ${detalles}">
                <td th:text="${d.codigo_detalle_venta}"></td>
                <td th:text="${d.cantidad}"></td>
                <td th:text="${d.precio_unitario}"></td>
                <td th:text="${d.subtotal}"></td>
                <td th:text="${d.productos_codigo_producto}"></td>
                <td th:text="${d.ventas_codigo_venta}"></td>
                <td>
                    <a th:href="@{'/eliminarDetalle/' + ${d.codigo_detalle_venta}}" onclick="return confirm('¿Estás seguro de que deseas eliminar este detalle?');">
                        <button class="btn-delete">
                            <i class="bi bi-trash"></i>
                        </button>
                    </a>
                </td>
            </tr>
        </table>

    </div>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Usuarios</h2>
        <div class="formulario">
            <input type="text" id="codigoUsuario" placeholder="Código Usuario">
            <input type="text" id="username" placeholder="Nombre de Usuario">
            <input type="text" id="email" placeholder="Email">
            <input type="text" id="password" placeholder="Contraseña">

            <select id="estado">
                <option value="">Estado</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <div class="botones">
                <button>Agregar</button>
                <button>Buscar</button>
                <button>Eliminar</button>
                <button>Limpiar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código Usuario</th>
                    <th>Nombre de Usuario</th>
                    <th>Email</th>
                    <th>Contraseña</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tablaUsuarios">
                <tr th:each="u : ${usuarios}">
                    <td th:text="${ u.codigo_usuario }"></td>
                    <td th:text="${ u.username }"></td>
                    <td th:text="${ u.email }"></td>
                    <td th:text="${ u.password }">
                    <td th:text="${ u.estado }"></td>
                </tr>
            </tbody>
        </table>

    </div>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang='en' xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='login.css'>
</head>
<body>
    <div class="contenedor">
        <div class="contenedor-login">
            <img src="Logo.png" alt="logo tienda">
            <h2>Bienvenido</h2>
            <form class="form-login" th:action="@{/login}" method="post">
                <input type="text" name="username" placeholder="username" required>
                <input type="password" name="password" placeholder="password" required>
                <button type="submit"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</button>
                <p>No tienes cuenta? <a href='register'>registrate aquí</a></p>
                <div th:if="${error}" style="color: red;">
                    <p th:text="${error}"></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

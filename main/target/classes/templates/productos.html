<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Productos</h2>
        <form class="formulario" th:action="@{/saveProduct}" method="post">
            <input type="text" id="idProducto" name="codigo" placeholder="ID Producto">
            <input type="text" id="nombre" name="nombre" placeholder="Nombre">
            <input type="text" id="precio" name="precio" placeholder="Precio">
            <input type="text" id="stock" name="stock" placeholder="Stock">
            
            <select id="estado" name="estado">
                <option value="">Estado</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <div class="botones">
                <button type="submit">Agregar</button>
                <button>Buscar</button>
                <button onclick="limpiarCampos()">Limpiar</button>
            </div>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Accion</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                <tr th:each="p : ${productos}">
                    <td th:text="${p.codigo_producto}"></td>
                    <td th:text="${p.nombre_producto}"></td>
                    <td th:text="${p.precio}"></td>
                    <td th:text="${p.stock}"></td>
                    <td th:text="${p.estado}"></td>
                    <td>
                        <a th:href="@{'/eliminarProduct/' + ${p.codigo_producto}}" onclick="return confirm('¿Estás seguro de que deseas eliminar este producto?');">
                            <button class="btn-delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

    <script src="productos.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='sistema.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo pagina">
            <ul>
                <li th:if="${usuario != null}" style="display: flex; align-items: center; gap: 10px; list-style: none;">
                    <div style="width: 45px; height: 45px; border-radius: 50%; overflow: hidden; border: 2px solid white; display: flex; justify-content: center; align-items: center; flex-shrink: 0;">
                        <img th:src="@{'/usuarios/foto/' + ${usuario.codigo_usuario}}"
                             alt="Perfil"
                             style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
                    </div>
                    <span style="color: white; font-weight: bold; font-size: 0.9rem;" th:text="${usuario.username}">Nombre</span>
                </li>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
                <a href="acceder"><button>Cerrar Sesión</button></a>
            </ul>
        </nav>
    </header>
    <div class="contenedor-home">
        <h1>Bienvenido al Sistema de Supermarker</h1>
        <p>Administra tus productos, ventas, clientes, etc de manera eficiente.</p>
        <div class="home-buttons">
            <a href="productos"><button><i class="bi bi-egg"></i> Productos</button></a>
            <a href="clientes"><button><i class="bi bi-people"></i> Clientes</button></a>
            <a href="usuarios"><button><i class="bi bi-person-square"></i> Usuarios</button></a>
            <a href="ventas"><button><i class="bi bi-cart"></i> Ventas</button></a>
            <a href="detalleventa"><button><i class="bi bi-list"></i> Detalles de venta</button></a>
        </div>
    </div>
    <footer>
        <div class="footer-contenido">
        <p>© 2026 Supermarker</p>
        <p>Tel: 1234-5678</p>
        <p>Email: contacto@supermarker.com</p>
    </div>
    </footer>
</body>
</html>

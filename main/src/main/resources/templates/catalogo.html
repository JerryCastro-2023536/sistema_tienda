<!DOCTYPE html>
<html lang='es' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel='stylesheet' href='principal.css'>
    <link rel="stylesheet" href="catalogo.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo pagina">
            <ul th:if="${usuario != null}">
                <li th:if="${usuario != null}">
                    <div class="perfil">
                        <img class="foto"
                            th:if="${usuario.foto != null}"
                            th:src="@{'/usuarios/foto/' + ${usuario.codigo_usuario}}"
                            alt="Perfil">

                        <img class="foto"
                            th:if="${usuario.foto == null and usuario.rol == 'ADMIN'}"
                            th:src="@{/admin_default.png}"
                            alt="Perfil Admin">

                        <img class="foto"
                            th:if="${usuario.foto != null and usuario.rol == 'ADMIN'}"
                            th:src="@{'/usuarios/foto/' + ${usuario.codigo_usuario}}"
                            alt="Perfil Admin">

                        <img class="foto"
                            th:if="${usuario.foto == null and usuario.rol == 'USER'}"
                            th:src="@{/user_default.png}"
                            alt="Perfil Usuario">
                        <span class="nombre" th:text="${usuario.username}">Nombre</span>
                    </div>
                </li>
                <a href="principal"><li>Inicio</li></a>
                <a href="catalogo"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="catalogo"><li>Comprar</li></a>
                <a href="sistema" th:if="${usuario.rol == 'ADMIN'}"><li>Administrar</li></a>
                <a href="acceder"><button>Cerrar Sesión</button></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-catalogo">
        <h2>Nuestro Catálogo Completo</h2>
        <p>Explora todos nuestros productos disponibles</p>

        <div class="grid-productos">
            <div class="card-producto" th:each="p : ${productos}">
                <div class="icon-container">
                    <i class="bi bi-box-seam"></i>
                </div>
                <h3 th:text="${p.nombre_producto}">Nombre del Producto</h3>
                <p class="precio-tag" th:text="'Q' + ${#numbers.formatDecimal(p.precio, 1, 2)}">Q0.00</p>
                
                <button class="btn-comprar">
                    <i class="bi bi-cart-plus"></i> Agregar
                </button>
            </div>
        </div>
    </div>

    <footer class="footer-contenido">
        <p>© 2026 Supermarker</p>
    </footer>
</body>
</html>

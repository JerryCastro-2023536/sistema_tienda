<!DOCTYPE html>
<html lang='en' xmlns:th="http://thymeleaf.org">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>

<body>

<header>
    <nav class="navbar">
        <img src="Logo.png" alt="logo">
        <ul>
            <a href="principal"><li>Inicio</li></a>
            <a href="ventas"><li>Ventas</li></a>
            <a href="#"><li>Contacto</li></a>
            <a href="sistema"><li>Administrar</li></a>
        </ul>
    </nav>
</header>

<div class="contenedor-productos">

    <h2>Registro de Ventas</h2>
    <form class="formulario" th:action="@{/saveVenta}" method="post">

        <input type="text" name="codigo" placeholder="Código Venta" required>
        <input type="date" name="fecha" required>
        <input type="text" name="total" placeholder="Total" required>
        <input type="text" name="cliente" placeholder="DPI Cliente" required>
        <input type="text" name="usuario" placeholder="Código Usuario" required>

        <select name="estado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
        </select>

        <div class="botones">
            <button type="submit">Agregar</button>
        </div>
    </form>

    <form class="search" th:action="@{/buscarVenta}" method="post">
        <input type="number" name="id" placeholder="Buscar por código" required>
        <button type="submit" class="btn-search">
            <i class="bi bi-search"></i>
        </button>
    </form>

    <button class="btn-limpiar" onclick="limpiarCampos()">Limpiar</button>
    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Estado</th>
            <th>DPI Cliente</th>
            <th>Usuario</th>
            <th>Acción</th>
        </tr>
        </thead>

        <tr th:each="v : ${ventas}">
            <td th:text="${v.codigo_venta}"></td>
            <td th:text="${v.fecha_venta}"></td>
            <td th:text="${v.total}"></td>
            <td th:text="${v.estado}"></td>
            <td th:text="${v.clientes_dpi_cliente}"></td>
            <td th:text="${v.usuarios_codigo_usuario}"></td>

            <td>
                <a th:href="@{'/eliminarVenta/' + ${v.codigo_venta}}"
                   onclick="return confirm('¿Eliminar esta venta?');">
                    <button class="btn-delete">
                        <i class="bi bi-trash"></i>
                    </button>
                </a>

                <!-- botón editar -->
                <button class="btn-edit"
                        th:data-codigo="${v.codigo_venta}"
                        th:data-fecha="${v.fecha_venta}"
                        th:data-total="${v.total}"
                        th:data-estado="${v.estado}"
                        th:data-cliente="${v.clientes_dpi_cliente}"
                        th:data-usuario="${v.usuarios_codigo_usuario}"
                        onclick="abrirModalVenta(this)">
                    <i class="bi bi-pencil"></i>
                </button>
            </td>
        </tr>
    </table>

</div>
<div id="modalVenta" class="modal">
    <div class="modal-content">

        <h3>Editar Venta</h3>

        <form th:action="@{/updateVenta}" method="post">

            <input type="hidden" id="editCodigo" name="codigo">
            <input type="date" id="editFecha" name="fecha">
            <input type="text" id="editTotal" name="total">
            <input type="text" id="editCliente" name="cliente">
            <input type="text" id="editUsuario" name="usuario">

            <select id="editEstado" name="estado">
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <button type="submit">Guardar</button>
            <button type="button" onclick="cerrarModal()">Cancelar</button>

        </form>
    </div>
</div>

<script>
    function cerrarModal() {
        document.getElementById("modalVenta").style.display = "none";
    }

    function abrirModalVenta(btn) {
        document.getElementById("modalVenta").style.display = "block";

        document.getElementById("editCodigo").value = btn.getAttribute("data-codigo");
        document.getElementById("editFecha").value = btn.getAttribute("data-fecha");
        document.getElementById("editTotal").value = btn.getAttribute("data-total");
        document.getElementById("editCliente").value = btn.getAttribute("data-cliente");
        document.getElementById("editUsuario").value = btn.getAttribute("data-usuario");

        let estado = btn.getAttribute("data-estado");
        document.getElementById("editEstado").value = (estado == 1 || estado == "1") ? "Activo" : "Inactivo";
    }
</script>

<footer>
    <p>© 2026 Supermarker</p>
</footer>

</body>
</html>

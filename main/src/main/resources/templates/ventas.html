<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ventas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel='stylesheet' href='principal.css'>
    <link rel='stylesheet' href='crud.css'>
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="Logo.png" alt="logo">
            <ul>
                <a href="principal"><li>Inicio</li></a>
                <a href="#"><li>Productos</li></a>
                <a href="#"><li>Contacto</li></a>
                <a href="#"><li>Comprar</li></a>
                <a href="sistema"><li>Administrar</li></a>
            </ul>
        </nav>
    </header>

    <div class="contenedor-productos">

        <h2>Registro de Ventas</h2>
        <div class="formulario">
            <input type="text" id="codigoVenta" placeholder="Código Venta">
            <input type="date" id="fecha" placeholder="Fecha">
            <input type="text" id="total" placeholder="Total">
            <input type="text" id="dpiCliente" placeholder="DPI Cliente">
            <input type="text" id="codigoUsuario" placeholder="Código Usuario">

            <select id="estado">
                <option value="">Estado</option>
                <option value="Activo">Activo</option>
                <option value="Inactivo">Inactivo</option>
            </select>

            <div class="botones">
                <button>Agregar</button>
                <button>Buscar</button>
                <button>Eliminar</button>
                <button>Limpiar</button>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Código Venta</th>
                    <th>Fecha</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>DPI Cliente</th>
                    <th>Código Usuario</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tablaVentas"></tbody>
                <tr th:each="v : ${ventas}">
                    <td th:text="${v.codigo_venta}"></td>
                    <td th:text="${v.fecha_venta}"></td>
                    <td th:text="${v.total}"></td>
                    <td th:text="${v.estado}"></td>
                    <td th:text="${v.clientes_dpi_cliente}"></td>
                    <td th:text="${v.usuarios_codigo_usuario}"></td>
                    <td>
                        <a th:href="@{'/eliminarVenta/' + ${v.codigo_venta}}" onclick="return confirm('¿Estás seguro de que deseas eliminar esta venta?');">
                            <button class="btn-delete">
                                <i class="bi bi-trash"></i>
                            </button>
                        </a>
                    </td>
                </tr>
        </table>

    </div>

    <footer>
        <p>© 2026 Supermarker</p>
    </footer>

</body>
</html>
